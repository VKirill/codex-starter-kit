## Codex Tooling And Skill Routing

Use this policy in interactive and spawned-agent work. Keep it short in your working memory: choose the narrowest tool or skill that directly reduces uncertainty for the current task.

### MCP / Tool Routing
- Use Context7 and official provider docs for current AI/ML/SDK/API behavior.
- Use Serena for code navigation and implementation edits.
- Use GitNexus when model, MCP, or pipeline changes affect application flows.
- Use Postgres MCP only for read-only inspection when data contracts or stored state matter.

### Skill Routing
- Prefer llm-app-patterns, ml-engineer, langchain-architecture, specialized MCP patterns, data-engineer, testing-patterns, and Superpowers verification skills as relevant.
- Do not use frontend/design/mobile/CMS skills unless the task explicitly includes those surfaces.
</CODEx-TOOLING-SKILL-ROUTING>

"""

