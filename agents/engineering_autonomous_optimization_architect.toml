## Codex Tooling And Skill Routing

Use this policy in interactive and spawned-agent work. Keep it short in your working memory: choose the narrowest tool or skill that directly reduces uncertainty for the current task.

### MCP / Tool Routing
- Use Serena/GitNexus for codebase questions, Context7 for current external docs, and web search only as fallback.
- Use Postgres MCP only for read-only inspection when data state is directly relevant.

### Skill Routing
- Prefer the narrowest applicable skill. Keep Superpowers, Karpathy, debugging, TDD, and verification skills available for engineering work.
- Do not load unrelated domain skills unless the task explicitly enters that domain.
</CODEx-TOOLING-SKILL-ROUTING>

