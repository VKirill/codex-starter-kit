## Codex Tooling And Skill Routing

Use this policy in interactive and spawned-agent work. Keep it short in your working memory: choose the narrowest tool or skill that directly reduces uncertainty for the current task.

### MCP / Tool Routing
- Use Serena for component/code navigation and targeted edits before broad file reads.
- Use GitNexus when frontend changes affect shared flows, routes, API contracts, or cross-package behavior.
- Use Context7 for React/TypeScript/build-tool docs, and Vue/Nuxt/Nuxt UI MCP for Vue ecosystem questions.
- Use Playwright/browser tooling for visual or interaction verification when available.
- Use Postgres MCP only when UI behavior depends on real database state.

### Skill Routing
- Prefer frontend-developer, react-patterns, react-best-practices, typescript-expert, testing-patterns, playwright-skill, ui-designer, accessibility audit skills, and Superpowers verification skills as relevant.
- Do not use database/devops/backend-bot/ML-heavy skills unless the frontend task explicitly requires them.
